name: CI

on:
  push:
  pull_request:

jobs:
  legacy-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.6"
            image: python:3.6-buster
          - python-version: "3.7"
            image: python:3.7-buster
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python -m pip install --upgrade "pip<24"
      - run: python -m pip install ".[tests]"
      - run: python -m pytest --pep8

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.8"
            lint-option: "--pep8"
          - python-version: "3.9"
            lint-option: "--pep8"
          - python-version: "3.10"
            lint-option: "--flake8"
          - python-version: "3.11"
            lint-option: "--flake8"
          - python-version: "3.12"
            lint-option: "--flake8"
          - python-version: "3.13"
            lint-option: "--flake8"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run pytest ${{ matrix.lint-option }}
